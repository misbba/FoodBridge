<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Thank You - FoodBridge</title>


    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">


    <style>


        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{

            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;

            background:#07140d;

            color:white;

            text-align:center;

        }

        /* Card */


        .box{


            width:430px;

            padding:45px;

            background:rgba(255,255,255,.08);

            backdrop-filter:blur(15px);

            border-radius:30px;

            box-shadow:0 0 35px rgba(124,255,124,.3);

            animation:appear 1s ease;


        }

        @keyframes appear{

            from{

                opacity:0;
                transform:translateY(30px);

            }

            to{

                opacity:1;
                transform:translateY(0);

            }
        }

        .logo{

            font-size:45px;

            color:#7CFF7C;

            margin-bottom:15px;

        }
        /* Spinner */
        .spinner{

            width:80px;

            height:80px;

            border:8px solid rgba(255,255,255,.2);

            border-top:8px solid #7CFF7C;

            border-radius:50%;

            margin:25px auto;

            animation:spin 1s linear infinite;


        }

        @keyframes spin{
            100%{

                transform:rotate(360deg);
            } }

        h1{
            font-size:38px;

            color:#7CFF7C;

            margin-bottom:15px;
        }
        p{
            font-size:17px;

            line-height:30px;

            color:#ddd;


        }

        .redirect{


            margin-top:25px;

            padding:12px;

            border-radius:20px;

            background:rgba(124,255,124,.15);

            color:#7CFF7C;

            font-weight:bold;


        }
        .footer-text{


            margin-top:20px;

            font-size:14px;

            color:#aaa;
        }
    </style>
    <script>

        setTimeout(function(){

            window.location.href="/login.html";

        },3000);

    </script>
</head>
<body>

<div class="box">

    <div class="logo">

        🍱 FoodBridge

    </div>

    <div class="spinner"></div>

    <h1>

        Thank You! 💚

    </h1>

    <p>

        Thank you for using <b>FoodBridge</b>.


        <br><br>


        Together, we can reduce food waste and help provide food to people in need.

        <br><br>


        Have a wonderful day!


    </p>

    <div class="redirect">

        Redirecting to Login...

    </div>

    <p class="footer-text">

        "Reducing Food Waste • Feeding Lives"

    </p>

</div>
</body>
</html>
