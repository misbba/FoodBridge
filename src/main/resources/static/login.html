<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FoodBridge Login</title>


    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{

            background:#07140d;
            color:white;
            min-height:100vh;

        }

        /* Loader */


        #loader{

            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:#07140d;

            display:flex;
            justify-content:center;
            align-items:center;

            z-index:9999;

            transition:.6s;

        }

        .loader-content{

            text-align:center;

        }

        .loader-content h1{

            font-size:48px;
            color:#7CFF7C;

        }

        .progress{

            width:300px;
            height:10px;

            background:#222;

            border-radius:20px;

            overflow:hidden;

            margin:20px auto;

        }

        .progress-bar{

            height:100%;

            width:100%;

            background:linear-gradient(90deg,#7CFF7C,#00ff88);

            transform:translateX(-100%);

            animation:loading 3s forwards;

        }

        @keyframes loading{

            from{

                transform:translateX(-100%);

            }

            to{

                transform:translateX(0);

            }

        }


        /* Navbar */


        nav{

            padding:18px 8%;

            background:rgba(255,255,255,.08);

            backdrop-filter:blur(15px);

        }



        .logo{

            display:flex;

            align-items:center;

            gap:12px;

        }



        .logo img{

            width:55px;

            height:55px;

            border-radius:50%;

            background:white;

            padding:5px;

        }



        .logo h2{

            color:#7CFF7C;

        }

        /* Login Box */


        .container{


            width:400px;

            margin:60px auto;

            padding:35px;


            background:rgba(255,255,255,.08);

            backdrop-filter:blur(15px);


            border-radius:25px;


            box-shadow:0 0 30px rgba(124,255,124,.25);



        }


        .container h1{


            text-align:center;

            font-size:38px;

            color:#7CFF7C;

            margin-bottom:10px;


        }


        .container p{

            text-align:center;

            color:#ddd;

        }


        label{

            display:block;

            margin-top:20px;

            margin-bottom:8px;

            font-weight:bold;

        }

        input{


            width:100%;

            padding:14px;

            border:none;

            border-radius:12px;

            background:#f5f5f5;

            font-size:15px;


        }

        button{


            width:100%;

            padding:15px;

            margin-top:25px;


            background:#7CFF7C;


            color:#07140d;

            font-size:16px;

            font-weight:bold;


            border:none;

            border-radius:20px;


            cursor:pointer;

            transition:.3s;


        }

        button:hover{


            background:#00ff88;

            transform:scale(1.03);


        }

        a{

            color:#7CFF7C;

            text-decoration:none;

            font-weight:bold;


        }

        .footer{


            margin-top:80px;

            background:#041008;

            text-align:center;

            padding:30px;


        }

        .footer h2{

            color:#7CFF7C;

        }

        @media(max-width:600px){


            .container {

                width: 85%;
            }
        }

    </style>


</head>



<body>




<!-- Loader -->


<div id="loader">


    <div class="loader-content">


        <h1>🍱 FoodBridge</h1>


        <p>Connecting Food with People</p>


        <div class="progress">


            <div class="progress-bar"></div>


        </div>


        <p>Loading Login...</p>


    </div>


</div>

<!-- Navbar -->


<nav>

    <div class="logo">


        <img src="/images/foodbridge-logo.png">


        <h2>FoodBridge</h2>

    </div>

</nav>

<!-- Login Form -->


<div class="container">


    <h1>🔐 Login</h1>


    <p>Welcome back to FoodBridge</p>



    <form action="/login" method="post">



        <label>Email</label>


        <input

                type="email"

                name="email"

                placeholder="Enter Email"

                required>

        <label>Password</label>


        <input

                type="password"

                name="password"

                placeholder="Enter Password"

                required>

        <button type="submit">

            Login 🚀

        </button>

    </form>

    <br>

    <p>

        Don't have an account?

        <a href="/register.html">

            Register
        </a>

    </p>

</div>
<footer class="footer">


    <h2>🍱 FoodBridge</h2>


    <p>

        Smart Food Donation & Distribution Management System

    </p>


    <p>

        "Reducing Food Waste • Feeding Lives"

    </p>

</footer>
<script>
    window.onload=function(){

        setTimeout(function(){

            document.getElementById("loader").style.opacity="0";

            setTimeout(function(){

                document.getElementById("loader").style.display="none";

            },500);
        },2500);

    };
</script>
</body>
</html>
