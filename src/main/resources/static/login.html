<!DOCTYPE html>
<html>
<head>
    <title>FoodBridge Login</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background-color:#f4f7f6;
            margin:0;
        }

        .header{
            background-color:#2e7d32;
            color:white;
            text-align:center;
            padding:25px;
        }

        .container{
            width:350px;
            margin:50px auto;
            background:white;
            padding:25px;
            border-radius:10px;
        }

        input{
            width:100%;
            padding:10px;
            margin-top:5px;
            margin-bottom:15px;
            border:1px solid #ccc;
            border-radius:5px;
        }

        button{
            width:100%;
            padding:12px;
            background:#2e7d32;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        h2{
            text-align:center;
        }
    </style>

</head>

<body>

<div class="header">
    <h1>FoodBridge</h1>
    <p>Smart Food Donation & Distribution System</p>
</div>

<div class="container">

    <h2>Login</h2>

    <form action="/dashboard.html">

        <label>Email</label>
        <input type="email" placeholder="Enter Email" required>

        <label>Password</label>
        <input type="password" placeholder="Enter Password" required>

        <button type="submit">Login</button>

    </form>

</div>

</body>
</html>
